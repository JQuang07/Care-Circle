services:
  postgres:
    image: postgres:16-alpine
    container_name: care-circle-db
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc
      POSTGRES_DB: care_circle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created. scripts/seed.ts re-applies it
      # idempotently, so an old volume still gets all four schemas.
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d care_circle"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
